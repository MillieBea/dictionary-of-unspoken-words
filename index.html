<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Dictionary of Unspoken Words Generator</title>
  </head>
  <body>
    <header>
      <h1>The AI Dictionary of Unspoken Words</h1>
    </header>
    <main>
      <form>
        <label for="feeling">Describe the unnamed feeling:</label>
        <br />
        <input
          id="feeling"
          type="text"
          placeholder="When a song I forgot existed finds me and ruins my whole day..."
          autofocus
          required
          autocomplete="off"
        />
        <br />
        <input type="submit" value="COIN NEW WORD" />
      </form>
      <div>
        Melanbust (n.)
        <br />
        A musical ambush that excavates buried grief. From
        <em> melancholy + ambush. </em>
        <br />
        <em
          >"The Spotify shuffle melanbust left him crying into past at 3pm."</em
        >
      </div>
    </main>
    <footer>
      This AI project was coded by
      <a href="https://github.com/MillieBea target=_blank">Milena</a> and is
      <a
        href="https://github.com/MillieBea/dictionary-of-unspoken-words"
        target="_blank"
        >open-sourced on Github</a
      >
      and is hosted on
      <a
        href="https://ai-dictionary-of-unspoken-words.netlify.app/"
        target="_blank"
        >Netlify</a
      >
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
