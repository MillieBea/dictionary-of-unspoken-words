    <title>AI Dictionary of Unspoken Words Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Unspoken Words</h1>
        <h2>- THE AI DICTIONARY -</h2>
      </header>
      <main>
        <label class="description">Describe the unnamed feeling:</label>
        <br />
        <form id="word-generator-form">
          <input
            type="text"
            placeholder="When a song I forgot existed finds me and ruins my whole day..."
            autofocus
            required
            autocomplete="off"
            class="feeling"
          />
          <br />
          <input type="submit" value="COIN NEW WORD" class="new-word-button" />
        </form>
        <div class="new-word-definition">
          <div class="new-word" id="word"></div>
          <br />
          <div class="definition" id="definition"></div>
          <br />
          <div class="example" id="example"></div>
        </div>
      </main>
      <footer>

          target="_blank"
          >open-sourced on Github</a
        >
        and hosted on
        <a
          href="https://ai-dictionary-of-unspoken-words.netlify.app/"
          target="_blank"
          >Netlify</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
