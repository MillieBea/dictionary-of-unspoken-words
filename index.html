    <title>AI Dictionary of Unspoken Words Generator</title>
  </head>
  <body>
    <video autoplay muted loop playsinline id="background-video">
      <source
        src="src/vecteezy_scary-concrete-with-black-smoke-drifting-for-background_16565758.mp4"
        type="video/mp4"
      />
    </video>
    <div class="container">
      <header>
        <h1>UNSPOKEN WORDS</h1>
        <h2>
          <span class="glyph">✦</span>
          THE AI DICTIONARY
          <span class="glyph">✦</span>
        </h2>
        <div class="symbol-divider">✦ ✶ ✦</div>
      </header>
      <main>
        <p class="description">Describe the unnamed feeling:</p>
        <br />
        <form id="word-generator-form">
          <input
            type="text"
            placeholder="When a song I forgot existed finds me and ruins my whole day..."
            autofocus
            required
            autocomplete="off"
            class="feeling"
            id="user-instructions"
          />
          <br />
          <input type="submit" value="COIN NEW WORD" class="new-word-button" />
        </form>
        <div class="new-word-definition hidden" id="result-container">
          <div class="new-word" id="word"></div>

          <br />
          <div class="definition" id="definition"></div>
          <br />
          <div class="example" id="example"></div>
        </div>
      </main>

      <footer>

          >open-sourced on Github</a
        >

          >Netlify</a

        <span class="glyph">✦</span>
      </footer>
    </div>
